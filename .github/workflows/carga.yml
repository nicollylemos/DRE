name: Teste de carga

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL base (ex. https://<id>.execute-api.us-east-1.amazonaws.com)
        required: true
      cenario:
        description: "carga = uso realista (tem que passar) · estresse = acha o limite"
        type: choice
        options: [carga, estresse]
        default: carga

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6 (${{ github.event.inputs.cenario }})
        run: k6 run --summary-export=k6-${{ github.event.inputs.cenario }}.json -e CENARIO="${{ github.event.inputs.cenario }}" -e BASE_URL="${{ github.event.inputs.url }}" tests/load/k6.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-${{ github.event.inputs.cenario }}
          path: k6-${{ github.event.inputs.cenario }}.json
