# Libera o .htaccess do projeto (rotas + bloqueio de pastas internas)
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off
# Access log com o IP real do usuário (o API Gateway manda no X-Client-Ip)
LogFormat "%{X-Client-Ip}i %h %t \"%r\" %>s %b %Dus \"%{User-Agent}i\"" cloudfront
CustomLog /proc/self/fd/1 cloudfront
