; Produção: erro técnico não vai pro navegador, vai pro log (stderr → CloudWatch)
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
upload_max_filesize = 20M
post_max_size = 22M
memory_limit = 256M
max_execution_time = 120
date.timezone = America/Sao_Paulo
opcache.enable = 1
opcache.validate_timestamps = 0
